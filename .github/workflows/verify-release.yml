name: Verify frozen release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify all eight frozen release files
        run: ./scripts/verify-release.sh
      - name: Verify filing revision event corpus v1
        run: ./revision-event-corpus/v1/verify-corpus.sh
      - name: Verify BigBear.ai accession-level PIT Revision Ledger v1
        run: ./bigbear-ai-revision-ledger/v1/verify-ledger.sh
      - name: Verify CoreWeave later-comparatives case study v1
        run: ./case-studies/coreweave-later-comparatives-v1/verify-case-study.sh
      - name: Verify recent AI infrastructure filing cross-section v1
        run: ./recent-ai-infrastructure-cross-section/v1.0.0/verify-release.sh
